<!DOCTYPE html>
<html lang="zh-CN" data-theme="devstack">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>DevStack</title>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #splash {
            position: fixed; inset: 0; z-index: 99999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #1a1a2e; color: #cbd5e1;
            font-size: 14px; gap: 24px;
            transition: opacity 0.4s ease;
        }
        #splash.hide { opacity: 0; pointer-events: none; }
        #splash-logo {
            width: 56px; height: 56px; border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 700; color: #fff;
            box-shadow: 0 4px 20px rgba(99,102,241,0.35);
        }
        #splash-spinner {
            width: 24px; height: 24px;
            border: 2.5px solid #334155; border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #splash-msg { color: #64748b; font-size: 13px; }
    </style>
</head>
<body>
<div id="splash">
    <div id="splash-logo">D</div>
    <div id="splash-spinner"></div>
    <div id="splash-msg">正在初始化…</div>
</div>
<div id="app"></div>

<script src="./src/main.ts" type="module"></script>
</body>
</html>
